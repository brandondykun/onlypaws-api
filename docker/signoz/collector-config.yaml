receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  prometheus:
    config:
      scrape_configs:
        - job_name: otel-collector
          scrape_interval: 30s
          static_configs:
            - targets: ["localhost:8888"]

processors:
  batch/traces:
    send_batch_size: 2048
    timeout: 5s
  batch/metrics:
    send_batch_size: 2048
    timeout: 30s
  batch/logs:
    send_batch_size: 2048
    timeout: 5s
  signozspanmetrics:
    metrics_exporter: signozclickhousemetrics
    latency_histogram_buckets:
      [2ms, 4ms, 6ms, 8ms, 10ms, 50ms, 100ms, 200ms, 400ms, 800ms, 1s, 1400ms, 2s, 5s, 10s, 15s]
    dimensions_cache_size: 100000
    aggregation_temporality: AGGREGATION_TEMPORALITY_DELTA
    enable_exp_histogram: true
    dimensions:
      - name: service.namespace
      - name: deployment.environment
  resourcedetection:
    detectors: [env, system]
    timeout: 2s
    override: false

exporters:
  clickhousetraces:
    datasource: tcp://clickhouse:9000/signoz_traces
    low_cardinal_exception_grouping: true
    use_new_schema: true
  signozclickhousemetrics:
    dsn: tcp://clickhouse:9000/signoz_metrics
  clickhouselogsexporter:
    dsn: tcp://clickhouse:9000/signoz_logs
    timeout: 10s
    use_new_schema: true
  metadataexporter:
    dsn: tcp://clickhouse:9000/signoz_metadata

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: "0.0.0.0"
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [signozspanmetrics, resourcedetection, batch/traces]
      exporters: [clickhousetraces, metadataexporter]
    metrics:
      receivers: [otlp, prometheus]
      processors: [resourcedetection, batch/metrics]
      exporters: [signozclickhousemetrics]
    logs:
      receivers: [otlp]
      processors: [resourcedetection, batch/logs]
      exporters: [clickhouselogsexporter]
