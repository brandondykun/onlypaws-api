# Docker compose override for production environment

services:
  only-paws-app:
    volumes:
      - ../api:/api
      - static_volume:/api/static
      - ../logs:/vol/log
    env_file:
      - prod/.env.prod
    command: >
      sh -c "python manage.py wait_for_db &&
             python manage.py ensure_vector_extension &&
             python manage.py migrate &&
             python manage.py load_report_reasons &&
             python manage.py load_profile_report_reasons &&
             python manage.py load_pet_types &&
             python manage.py collectstatic --noinput &&
             daphne -b 0.0.0.0 -p 8000 core.asgi:application"
    expose:
      - "8000"

  only-paws-db:
    volumes:
      - only-paws-db-data-prod:/var/lib/postgresql/data
      - ../init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    env_file:
      - prod/.env.prod.db

  nginx:
    build: ../nginx
    volumes:
      - static_volume:/vol/web/static:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - only-paws-app
    environment:
      - DOMAIN=api.onlypawsapp.com

  certbot:
    image: certbot/certbot:latest
    volumes:
      - ./certbot/www/:/var/www/certbot/:rw
      - ./certbot/conf/:/etc/letsencrypt/:rw

  # Celery worker for general tasks - Production optimized
  celery-worker-default:
    container_name: onlypaws_celery_default_prod
    image: only-paws-only-paws-app
    depends_on:
      - only-paws-app
      - only-paws-db
      - redis
    volumes:
      - ../api:/api
      - ../logs:/vol/log
      - ../models:/app/models
    env_file:
      - prod/.env.prod
    environment:
      - DJANGO_SETTINGS_MODULE=core.settings
      - PYTHONPATH=/api
    working_dir: /api
    command: python -m celery -A core worker -Q default,recommendations,maintenance -l info --concurrency=4
    restart: unless-stopped
    networks:
      - default
      - observability
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # Celery worker for embedding tasks (CPU intensive) - Production optimized
  celery-worker-embeddings:
    container_name: onlypaws_celery_embeddings_prod
    image: only-paws-only-paws-app
    depends_on:
      - only-paws-app
      - only-paws-db
      - redis
    volumes:
      - ../api:/api
      - ../logs:/vol/log
      - ../models:/app/models
    env_file:
      - prod/.env.prod
    environment:
      - DJANGO_SETTINGS_MODULE=core.settings
      - PYTHONPATH=/api
    working_dir: /api
    command: python -m celery -A core worker -Q embeddings -l info --concurrency=2
    restart: unless-stopped
    networks:
      - default
      - observability
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  # Celery beat for periodic tasks
  celery-beat:
    container_name: onlypaws_celery_beat_prod
    image: only-paws-only-paws-app
    depends_on:
      - only-paws-app
      - only-paws-db
      - redis
    volumes:
      - ../api:/api
      - ../logs:/vol/log
      - celery_beat_schedule:/tmp
    env_file:
      - prod/.env.prod
    environment:
      - DJANGO_SETTINGS_MODULE=core.settings
      - PYTHONPATH=/api
    working_dir: /api
    command: python -m celery -A core beat -l info
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

volumes:
  only-paws-db-data-prod:
  static_volume:
  celery_beat_schedule:
