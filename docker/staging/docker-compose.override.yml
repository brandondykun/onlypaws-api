# Docker compose override for staging environment

services:
  only-paws-app:
    volumes:
      - ../api:/api
      - static_volume:/api/static
      - ../logs:/vol/log
    env_file:
      - staging/.env.staging
    command: >
      sh -c "python manage.py wait_for_db &&
             python manage.py migrate &&
             python manage.py load_report_reasons &&
             python manage.py load_pet_types &&
             python manage.py collectstatic --noinput &&
             daphne -b 0.0.0.0 -p 8000 core.asgi:application"
    expose:
      - "8000"

  only-paws-db:
    volumes:
      - staging_db_volume:/var/lib/postgresql/data
    env_file:
      - staging/.env.staging.db

  nginx:
    build: ../nginx
    volumes:
      - static_volume:/vol/web/static:ro
      - ./staging/certbot/conf:/etc/letsencrypt
      - ./staging/certbot/www:/var/www/certbot
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - only-paws-app
    environment:
      - DOMAIN=api-staging.onlypawsapp.com

  certbot:
    image: certbot/certbot:latest
    volumes:
      - ./staging/certbot/www:/var/www/certbot
      - ./staging/certbot/conf:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

  # Celery worker for general tasks
  celery-worker-default:
    container_name: onlypaws_celery_default_staging
    image: only-paws-only-paws-app
    depends_on:
      - only-paws-app
      - only-paws-db
      - redis
    volumes:
      - ../api:/api
      - ../logs:/vol/log
    env_file:
      - staging/.env.staging
    environment:
      - DJANGO_SETTINGS_MODULE=core.settings
      - PYTHONPATH=/api
    working_dir: /api
    command: python -m celery -A core worker -Q default -l info --concurrency=2
    restart: unless-stopped

  # Celery worker for embedding tasks (CPU intensive)
  celery-worker-embeddings:
    container_name: onlypaws_celery_embeddings_staging
    image: only-paws-only-paws-app
    depends_on:
      - only-paws-app
      - only-paws-db
      - redis
    volumes:
      - ../api:/api
      - ../logs:/vol/log
    env_file:
      - staging/.env.staging
    environment:
      - DJANGO_SETTINGS_MODULE=core.settings
      - PYTHONPATH=/api
    working_dir: /api
    command: python -m celery -A core worker -Q embeddings -l info --concurrency=2
    restart: unless-stopped

  # Celery beat for periodic tasks
  celery-beat:
    container_name: onlypaws_celery_beat_staging
    image: only-paws-only-paws-app
    depends_on:
      - only-paws-app
      - only-paws-db
      - redis
    volumes:
      - ../api:/api
      - ../logs:/vol/log
      - celery_beat_schedule:/tmp
    env_file:
      - staging/.env.staging
    environment:
      - DJANGO_SETTINGS_MODULE=core.settings
      - PYTHONPATH=/api
    working_dir: /api
    command: python -m celery -A core beat -l info
    restart: unless-stopped

volumes:
  staging_db_volume:
  static_volume:
  celery_beat_schedule: