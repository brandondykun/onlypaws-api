# Docker compose  override for e2e testing environment

services:
  only-paws-app:
    ports:
      - "8000:8000"
    volumes:
      - ../api:/api
      - ../api/media:/api/media # Local media storage
      - ../logs:/vol/log # Mount entire logs directory for multiple log files
    env_file:
      - e2e/.env.e2e
    command: >
      sh -c "python manage.py wait_for_db &&
             python manage.py ensure_vector_extension &&
             python manage.py migrate &&
             python manage.py load_report_reasons &&
             python manage.py load_profile_report_reasons &&
             python manage.py load_pet_types &&
             daphne -b 0.0.0.0 -p 8000 core.asgi:application"

  only-paws-db:
    volumes:
      - only-paws-db-data-e2e:/var/lib/postgresql/data
      - ../init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    env_file:
      - e2e/.env.e2e.db

  # Celery worker for general tasks - e2e Test environment
  celery-worker-default:
    container_name: onlypaws_celery_default_e2e
    image: only-paws-only-paws-app
    depends_on:
      - only-paws-app
      - only-paws-db
      - redis
    volumes:
      - ../api:/api
      - ../logs:/vol/log # Mount entire logs directory
      - ../models:/app/models
    env_file:
      - e2e/.env.e2e
    environment:
      - DJANGO_SETTINGS_MODULE=core.settings
      - PYTHONPATH=/api
    working_dir: /api
    command: python -m celery -A core worker -Q default,recommendations,maintenance -l info --concurrency=2
    restart: unless-stopped

  # Celery worker for embedding tasks - e2e Test environment
  celery-worker-embeddings:
    container_name: onlypaws_celery_embeddings_e2e
    image: only-paws-only-paws-app
    depends_on:
      - only-paws-app
      - only-paws-db
      - redis
    volumes:
      - ../api:/api
      - ../logs:/vol/log # Mount entire logs directory
      - ../models:/app/models
    env_file:
      - e2e/.env.e2e
    environment:
      - DJANGO_SETTINGS_MODULE=core.settings
      - PYTHONPATH=/api
    working_dir: /api
    command: python -m celery -A core worker -Q embeddings -l info --concurrency=1
    restart: unless-stopped

volumes:
  only-paws-db-data-e2e:
