# Docker compose override for local development environment

services:
  only-paws-app:
    ports:
      - "8000:8000"
    volumes:
      - ../api:/api
      - ../api/media:/api/media  # Local media storage
      - ../logs/django-dev.log:/vol/log/django.log
    env_file:
      - dev/.env.dev.local
    command: >
      sh -c "python manage.py wait_for_db &&
             python manage.py migrate &&
             python manage.py load_report_reasons &&
             python manage.py load_pet_types &&
             python manage.py runserver 0.0.0.0:8000"

  only-paws-db:
    volumes:
      - only-paws-db-data-dev:/var/lib/postgresql/data
    env_file:
      - dev/.env.dev.local.db

  # Celery worker for general tasks
  celery-worker-default:
    container_name: onlypaws_celery_default
    image: only-paws-only-paws-app
    depends_on:
      - only-paws-app
      - only-paws-db
      - redis
    volumes:
      - ../api:/api
      - ../logs/django-dev.log:/vol/log/django.log
    env_file:
      - dev/.env.dev.local
    environment:
      - DJANGO_SETTINGS_MODULE=core.settings
      - PYTHONPATH=/api
    working_dir: /api
    command: python -m celery -A core worker -Q default -l info --concurrency=4
    restart: unless-stopped

  # Celery worker for embedding tasks (CPU intensive)
  celery-worker-embeddings:
    container_name: onlypaws_celery_embeddings
    image: only-paws-only-paws-app
    depends_on:
      - only-paws-app
      - only-paws-db
      - redis
    volumes:
      - ../api:/api
      - ../logs/django-dev.log:/vol/log/django.log
    env_file:
      - dev/.env.dev.local
    environment:
      - DJANGO_SETTINGS_MODULE=core.settings
      - PYTHONPATH=/api
    working_dir: /api
    command: python -m celery -A core worker -Q embeddings -l info --concurrency=1
    restart: unless-stopped

  # Celery beat for periodic tasks (optional)
  celery-beat:
    container_name: onlypaws_celery_beat
    image: only-paws-only-paws-app
    depends_on:
      - only-paws-app
      - only-paws-db
      - redis
    volumes:
      - ../api:/api
      - ../logs/django-dev.log:/vol/log/django.log
      - celery_beat_schedule:/tmp
    env_file:
      - dev/.env.dev.local
    environment:
      - DJANGO_SETTINGS_MODULE=core.settings
      - PYTHONPATH=/api
    working_dir: /api
    command: python -m celery -A core beat -l info
    restart: unless-stopped

volumes:
  only-paws-db-data-dev:
  celery_beat_schedule: